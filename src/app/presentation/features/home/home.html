<po-page-default
  p-title="Portal Backoffice"
  p-subtitle="Consulta de cliente por ID (API real com Basic Auth)"
  [p-breadcrumb]="breadcrumbControl.getBreadcrumb()"
>
  <p class="home-intro">
    Digite o ID do cliente e pesquise. A aplicação chama a API real e abre a tela de resultados.
  </p>

  <div class="search-row">
    <po-input
      class="search-row__field"
      name="searchTerm"
      p-label="Buscar cliente por ID"
      p-placeholder="Ex.: 1001"
      p-icon="an an-magnifying-glass"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
      (keyup.enter)="onSearch()"
    >
    </po-input>

    <po-button
      class="search-row__button"
      p-label="Buscar"
      p-icon="an an-magnifying-glass"
      p-kind="primary"
      (click)="onSearch()"
    >
    </po-button>
  </div>
</po-page-default>
